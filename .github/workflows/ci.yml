name: CI

on:
  push:
  pull_request:

jobs:
  releases:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.matrix.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
      - name: Check release relationships and select supported builds
        id: matrix
        run: |
          python3 tools/releases.py
          echo "rust=$(jq -c '[.releases[].snapshot]' data/source/releases.json)" >> "$GITHUB_OUTPUT"

  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Fetch locked block, biome and shape inputs
        env:
          CLOUDBURST_DIR: ${{ runner.temp }}/protocolgen-cloudburst
        run: |
          set -euo pipefail
          mkdir -p "$CLOUDBURST_DIR"
          revision=$(jq -er '.upstreams[.semantic.cloudburst].revision' data/source/lock.json)
          repository=$(jq -er '.upstreams[.semantic.cloudburst].repository' data/source/lock.json)
          for name in blocks.json stripped_biome_definitions.json voxel_shapes.json; do
            curl --fail --location --retry 3 --max-time 120 \
              "https://raw.githubusercontent.com/$repository/$revision/$name" \
              --output "$CLOUDBURST_DIR/$name"
          done
      - name: Test shared game data
        env:
          PROTOCOLGEN_CLOUDBURST_DIR: ${{ runner.temp }}/protocolgen-cloudburst
        run: |
          go -C data test ./...
          go -C data vet ./...
          go -C generated/data test ./...
          go -C generated/data vet ./...
      - name: Verify runtime item, mining and registry generation
        run: |
          go -C data run ./cmd/runtimegen
          go -C data run ./cmd/mininggen
          go -C data run ./cmd/registrygen
          git diff --exit-code -- generated/data
          test -z "$(git ls-files --others --exclude-standard -- generated/data)"

  differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
          cache-dependency-path: differential/go.sum

      - name: Differential codec tests
        run: make differential

  retail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
          cache-dependency-path: |
            go.sum
            differential/retail/go.sum

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/retail-target
          key: retail-${{ runner.os }}-${{ hashFiles('differential/retail/corpus.json', 'differential/retail/runner/Cargo.toml', 'differential/retail/bench/Cargo.toml') }}
          restore-keys: retail-${{ runner.os }}-

      - name: Compare retail and synthetic fixtures across Valentine, generated Rust, generated Go and gophertunnel
        run: make retail GO_CACHE="$RUNNER_TEMP/protocolgen-go-cache"

      - name: Preserve verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retail-verdicts
          path: |
            build/retail/expected.tsv
            build/retail/verdicts/
            build/retail/fields/
            build/retail/report.txt
          if-no-files-found: warn

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
          cache-dependency-path: go.sum

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Verify Rust snapshots from checked manifests
        run: make verify-rust GO_CACHE="$RUNNER_TEMP/protocolgen-go-cache"

      - name: Fetch pinned protocol sources
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/Mojang/bedrock-protocol-docs.git "$RUNNER_TEMP/protocolgen-mojang"
          git -C "$RUNNER_TEMP/protocolgen-mojang" checkout --detach "$(jq -r ' .sources[] | select(.id == "mojang") | .revision' generated/1.26.40/source-lock.json)"
          git clone --filter=blob:none --no-checkout https://github.com/EndstoneMC/protocol-docs.git "$RUNNER_TEMP/protocolgen-endstone"
          git -C "$RUNNER_TEMP/protocolgen-endstone" checkout --detach "$(jq -r ' .sources[] | select(.id == "endstone") | .revision' generated/1.26.40/source-lock.json)"

      - name: Regenerate and verify
        run: |
          make verify \
            GO_CACHE="$RUNNER_TEMP/protocolgen-go-cache" \
            MOJANG_DIR="$RUNNER_TEMP/protocolgen-mojang/json" \
            ENDSTONE_DIR="$RUNNER_TEMP/protocolgen-endstone"

      - name: Regenerate and verify 1.26.50
        run: |
          git -C "$RUNNER_TEMP/protocolgen-mojang" worktree add --detach "$RUNNER_TEMP/protocolgen-mojang-2187" "$(jq -r '.sources[] | select(.id == "mojang") | .revision' generated/1.26.50/source-lock.json)"
          git -C "$RUNNER_TEMP/protocolgen-endstone" worktree add --detach "$RUNNER_TEMP/protocolgen-endstone-2187" "$(jq -r '.sources[] | select(.id == "endstone") | .revision' generated/1.26.50/source-lock.json)"
          make verify-1.26.50 \
            GO_CACHE="$RUNNER_TEMP/protocolgen-go-cache" \
            MOJANG_DIR="$RUNNER_TEMP/protocolgen-mojang-2187/json" \
            ENDSTONE_DIR="$RUNNER_TEMP/protocolgen-endstone-2187"

      - name: Regenerate and verify 1.26.51
        run: |
          git -C "$RUNNER_TEMP/protocolgen-mojang" worktree add --detach "$RUNNER_TEMP/protocolgen-mojang-2193" "$(jq -r '.sources[] | select(.id == "mojang") | .revision' generated/1.26.51/source-lock.json)"
          git -C "$RUNNER_TEMP/protocolgen-endstone" worktree add --detach "$RUNNER_TEMP/protocolgen-endstone-2193" "$(jq -r '.sources[] | select(.id == "endstone") | .revision' generated/1.26.51/source-lock.json)"
          make verify-1.26.51 \
            GO_CACHE="$RUNNER_TEMP/protocolgen-go-cache" \
            ORACLE_REPORT="$RUNNER_TEMP/gophertunnel-report.json" \
            MOJANG_DIR="$RUNNER_TEMP/protocolgen-mojang-2193/json" \
            ENDSTONE_DIR="$RUNNER_TEMP/protocolgen-endstone-2193"

      - name: Preserve oracle comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gophertunnel-oracle-2193
          path: ${{ runner.temp }}/gophertunnel-report.json
          if-no-files-found: warn

      - name: Verify 1.26.60 preview source corrections
        run: |
          git -C "$RUNNER_TEMP/protocolgen-mojang" worktree add --detach "$RUNNER_TEMP/protocolgen-mojang-2211" "$(jq -r '.sources[] | select(.id == "mojang") | .revision' candidates/1.26.60-preview.25/source-lock.json)"
          git -C "$RUNNER_TEMP/protocolgen-endstone" worktree add --detach "$RUNNER_TEMP/protocolgen-endstone-2211" "$(jq -r '.sources[] | select(.id == "endstone") | .revision' candidates/1.26.60-preview.25/source-lock.json)"
          make ingest-1.26.60 \
            GO_CACHE="$RUNNER_TEMP/protocolgen-go-cache" \
            MOJANG_DIR="$RUNNER_TEMP/protocolgen-mojang-2211/json" \
            ENDSTONE_DIR="$RUNNER_TEMP/protocolgen-endstone-2211"

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted="$(git ls-files -z '*.go' ':!generated/**' | xargs -0 gofmt -l)"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi

  rust-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
          cache-dependency-path: go.sum

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Verify, lint and test the checked-in codec-contract crate
        run: make rust-contract GO_CACHE="$RUNNER_TEMP/protocolgen-go-cache"

  rust:
    needs: releases
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ${{ fromJSON(needs.releases.outputs.rust) }}
    defaults:
      run:
        working-directory: generated/${{ matrix.version }}/rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ matrix.version }}-${{ hashFiles(format('generated/{0}/rust/Cargo.lock', matrix.version), format('generated/{0}/rust/Cargo.toml', matrix.version)) }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Select crate toolchain
        run: rustup show active-toolchain

      - name: Cargo check
        run: |
          if [ -f Cargo.lock ]; then
            cargo check --locked
          else
            cargo check
          fi

      - name: Cargo clippy
        run: |
          if [ -f Cargo.lock ]; then
            cargo clippy --locked -- -D warnings
          else
            cargo clippy -- -D warnings
          fi

      - name: Cargo test
        run: |
          if [ -f Cargo.lock ]; then
            cargo test --locked
          else
            cargo test
          fi
